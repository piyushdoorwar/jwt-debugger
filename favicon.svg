<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6739B7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFE55C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC700;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background with shadow -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  
  <!-- Glow effect -->
  <circle cx="32" cy="32" r="24" fill="url(#glow)"/>
  
  <!-- Outer decorative ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Middle ring with dashes -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5" stroke-dasharray="3 4"/>
  
  <!-- Shield/security badge shape -->
  <path d="M32 12 L42 16 L42 26 Q42 34 32 40 Q22 34 22 26 L22 16 Z" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  
  <!-- Lock icon suggestion -->
  <rect x="29" y="26" width="6" height="6" rx="1" fill="url(#accent)" opacity="0.4"/>
  <path d="M28 26 Q28 23 32 23 Q36 23 36 26" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
  
  <!-- JWT Text -->
  <text x="32" y="52" font-family="'Inter', Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="url(#accent)" letter-spacing="-0.5">JWT</text>
</svg>