<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6739B7"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="16" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="48" fill="none" stroke="#FFD700" stroke-width="6" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" values="0 64 64;360 64 64" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="64" cy="64" r="40" fill="#FFD700">
    <animate attributeName="r" values="32;48;32" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#FFD700;#4F8EF7;#FFD700" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="64" y="76" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">JWT</text>
</svg>